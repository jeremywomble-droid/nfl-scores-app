name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Decode release keystore
        env:
          NFL_KEYSTORE_BASE64: ${{ secrets.NFL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NFL_KEYSTORE_BASE64" ]; then
            echo "::error::NFL_KEYSTORE_BASE64 secret is not set - cannot produce a stably-signed release APK."
            exit 1
          fi
          echo "$NFL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nfl-scores-release.jks"
          echo "NFL_KEYSTORE_FILE=$RUNNER_TEMP/nfl-scores-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          NFL_KEYSTORE_PASSWORD: ${{ secrets.NFL_KEYSTORE_PASSWORD }}
          NFL_KEY_ALIAS: ${{ secrets.NFL_KEY_ALIAS }}
          NFL_KEY_PASSWORD: ${{ secrets.NFL_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nfl-scores-release-apk
          path: app/build/outputs/apk/release/app-release.apk
